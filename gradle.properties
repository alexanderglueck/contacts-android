# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Both opt-outs are still required, and they are load-bearing in opposite
# directions -- re-tested against AGP 9.3.1 with KGP 2.3.21 and 2.4.10:
#
# builtInKotlin=false: AGP's built-in Kotlin pins the Kotlin version to the one
# AGP bundles (2.2.10 for AGP 9.3.1), which is older than the 2.3.21 we compile
# with and cannot read Kotlin 2.4 library metadata. So we keep applying KGP.
#
# newDsl=false: KGP's org.jetbrains.kotlin.android plugin still casts the
# Android extension to the removed BaseExtension, so with the new DSL it fails
# to apply outright (ClassCastException on ApplicationExtensionImpl). Still true
# in KGP 2.4.10.
#
# Together these also cap Kotlin at 2.3.x: Kotlin 2.4 turns the deprecated
# `android {}` script accessor into a hard error, and the only escape (new DSL)
# is the one KGP cannot apply. Both options disappear in AGP 10, so revisit when
# KGP supports the new DSL -- that is the unblock, not a newer AGP alone.
android.builtInKotlin=false
android.newDsl=false
